
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leslie Knope Compliment Generator</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #1e1e24;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            max-width: 500px;
            background: #2a2a35;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        h1 { color: #ff6b6b; font-size: 1.8rem; }
        #compliment-box { font-size: 1.4rem; font-style: italic; margin: 20px 0; min-height: 60px;}
        button {
            background-color: #ff6b6b; color: white; border: none;
            padding: 12px 24px; font-weight: bold; border-radius: 8px; cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Knope Compliment Generator</h1>
        <div id="compliment-box">Generating your compliment...</div>
        <button onclick="generateCompliment()">Get Another</button>
    </div>

    <script>
        // Mix and match openers
        const openers = [
            "You beautiful,",
            "You poetic and noble",
            "You sophisticated,",
            "You cunning, pliable,",
            "You brilliant, powerful,",
            "You magnificent, rainbow-infused,",
            "You majestic,",
            "You beautiful, tropical,",
            "You fierce, independent,",
            "You stunning, high-achieving,",
            "You flawless,",
            "You inspiring, historical,"
        ];

        // Leslie-style descriptive words
        const adjectives = [
            "rule-breaking",
            "chestnut-haired",
            "talented",
            "glowing",
            "sassy",
            "opalescent",
            "space-traveling",
            "unstoppable",
            "agenda-setting",
            "sparkle-covered",
            "over-achieving",
            "rainbow-infused",
            "sweet-faced",
            "glowing-sun"
        ];

        // Majestic creatures and nouns
        const nouns = [
            "moth.",
            "musk ox.",
            "land mermaid.",
            "space unicorn.",
            "sunfish.",
            "sun goddess.",
            "mannequin come to life.",
            "baby bird.",
            "goatherd.",
            "fish-cat.",
            "champion.",
            "pocket-sized warrior.",
            "goddess of victory.",
            "workhorse.",
            "historical monument.",
            "magical creature.",
            "waffle queen."
        ];

        function getRandomItem(array) {
            return array[Math.floor(Math.random() * array.length)];
        }

        function generateCompliment() {
            // Build the phrase piece by piece
            const opener = getRandomItem(openers);
            const adj = getRandomItem(adjectives);
            const noun = getRandomItem(nouns);
            
            const fullCompliment = `${opener} ${adj} ${noun}`;
            
            // Display on the webpage for humans
            document.getElementById('compliment-box').innerText = fullCompliment;
            
            // Set the page title so your Apple Shortcut grabs it cleanly
            document.title = fullCompliment;
        }
        
        // Auto-run when the link opens
        generateCompliment();
    </script>

</body>
</html>
